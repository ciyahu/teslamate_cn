name: "Build And Push Grafana To Docker Hub"

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Image tag'
        required: true
        default: 'latest'
      source_digest:
        description: 'Existing ciyahu/grafana digest to promote to latest without rebuilding'
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Show build source
        run: |
          echo "Building ref: $GITHUB_REF"
          git rev-parse --short HEAD

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: inputs.source_digest == ''
        uses: docker/build-push-action@v6
        with:
          context: grafana
          file: grafana/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          tags: ciyahu/grafana:${{ github.event.inputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote existing Grafana image
        if: inputs.source_digest != ''
        env:
          DIGEST: ${{ inputs.source_digest }}
          TAG: ${{ inputs.version_tag }}
        run: |
          [[ "$TAG" == latest && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          docker buildx imagetools create -t ciyahu/grafana:latest "ciyahu/grafana@$DIGEST"
